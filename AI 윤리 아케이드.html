<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 윤리 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 아케이드 캐비닛 한 화면 — 상단 HUD / 가운데 스테이지 / 하단 조작 패드. 의도적으로 다크 단일 테마(네온 CRT). */
:root{
  --void:#150c2f;      /* 배경: 깊은 보라 CRT */
  --panel:#211548;     /* 패널 */
  --line:#43318a;      /* 테두리·그리드 */
  --ink:#f1ecff;       /* 본문 */
  --dim:#ab9fd8;       /* 보조 텍스트 */
  --amber:#ffc83d;     /* 메인 강조: 코인/점수 */
  --pink:#ff4f9a;      /* 위험/적 */
  --cyan:#4fe6ff;      /* 신뢰/선택 */
  --good:#7dffab;
  --bad:#ff6150;
  --pixel:"Press Start 2P", "Nanum Gothic Coding", monospace;
  --display:"Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body:"Nanum Gothic Coding", "D2Coding", "Malgun Gothic", monospace;
  --fs:clamp(15px, 0.55vw + 11px, 21px);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.6;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;gap:10px;position:relative}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 22px;font-family:var(--pixel);font-size:clamp(9px,0.5vw + 6px,13px);letter-spacing:.06em;border-bottom:3px solid var(--line);padding-bottom:10px}
.hud .blk{display:flex;flex-direction:column;gap:6px}
.hud .lbl{color:var(--pink)}
.hud .val{color:var(--ink)}
.hud .lbl small{font-family:var(--body);font-size:12px;color:var(--dim);letter-spacing:0;margin-left:6px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border:2px solid var(--line);display:block}
.dots i.on{background:var(--amber);border-color:var(--amber)}
.dots i.done{background:var(--line)}
.trust{display:flex;gap:3px}
.trust i{width:12px;height:16px;background:#2b1f57;display:block}
.trust i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.trust.low i.on{background:var(--bad);box-shadow:0 0 6px var(--bad)}

main{overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
.screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:8px 20px}

/* TITLE */
#bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.9}
.title{position:relative;align-items:center;text-align:center}
.title h1{font-family:var(--pixel);font-weight:400;font-size:clamp(26px,5.2vw,78px);line-height:1.25;margin:0;color:var(--amber);
  text-shadow:4px 4px 0 var(--pink),8px 8px 0 #3b1d7a;text-wrap:balance}
.title h1 span{display:block;color:var(--cyan);text-shadow:4px 4px 0 #1b5a7a,8px 8px 0 #3b1d7a}
.title .ko{font-family:var(--display);font-size:clamp(24px,2.6vw,44px);margin:0;color:var(--ink)}
.team{display:flex;gap:10px;align-items:center;justify-content:center;font-family:var(--pixel);font-size:12px;color:var(--dim)}
.team input{background:transparent;border:0;border-bottom:3px dashed var(--line);color:var(--amber);font-family:var(--display);font-size:clamp(20px,1.6vw,28px);width:12ch;text-align:center;padding:2px 4px}
.start{font-family:var(--pixel);font-size:clamp(14px,1.2vw,20px);background:var(--pink);color:#fff;border:0;padding:18px 28px;box-shadow:0 6px 0 #9b1e57;animation:blink 1.1s steps(1) infinite}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #9b1e57}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;max-width:900px;width:100%;margin-inline:auto;text-align:left}
.howto div{background:rgba(33,21,72,.85);border:2px solid var(--line);padding:12px 14px;font-size:.85em;color:var(--dim)}
.howto b{display:block;font-family:var(--pixel);font-size:11px;color:var(--amber);margin-bottom:8px;font-weight:400}
.coin{font-family:var(--pixel);font-size:11px;color:var(--dim)}
@keyframes blink{50%{opacity:.35}}

/* STAGE */
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start;max-width:1400px;width:100%;margin-inline:auto}
.foe{display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{font-family:var(--pixel);font-size:clamp(10px,0.6vw + 6px,14px);color:var(--pink);letter-spacing:.08em}
.stage h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,3.6vw,64px);line-height:1.05;margin:0;color:var(--amber);text-wrap:balance}
.stage .sub{font-family:var(--display);font-size:clamp(19px,1.5vw,28px);color:var(--cyan);margin:0}
.sprite-wrap{background:radial-gradient(circle at 50% 60%, #2c1c63 0%, transparent 70%);display:flex;justify-content:center;padding:10px 0 4px;border-bottom:3px solid var(--line)}
canvas.sp{image-rendering:pixelated;width:min(100%,220px);height:auto;animation:bob 1s steps(2) infinite}
canvas.sp.wide{width:min(100%,360px)}
@keyframes bob{50%{transform:translateY(6px)}}
.case{border:2px dashed var(--line);padding:12px 14px;font-size:.88em;color:var(--dim)}
.case b{font-family:var(--pixel);font-size:10px;color:var(--good);display:block;margin-bottom:8px;font-weight:400;letter-spacing:.08em}

.play{display:flex;flex-direction:column;gap:16px;min-width:0}
.scenario{background:var(--panel);border:3px solid var(--ink);padding:16px 18px;position:relative;box-shadow:6px 6px 0 #0b0620}
.scenario::before{content:"SITUATION";position:absolute;top:-11px;left:14px;background:var(--ink);color:var(--void);font-family:var(--pixel);font-size:10px;padding:3px 8px}
.scenario p{margin:0;font-size:1.05em}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.issues li::before{content:"?";font-family:var(--pixel);font-size:12px;color:var(--void);background:var(--amber);width:22px;height:22px;display:grid;place-items:center}
.choose{font-family:var(--pixel);font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch{text-align:left;background:#1a1040;border:3px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .08s}
.ch:hover{border-color:var(--ink);transform:translateY(-2px)}
.ch .k{font-family:var(--pixel);font-size:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#fff}
.ch.a .k{background:var(--pink);box-shadow:0 3px 0 #9b1e57}
.ch.b .k{background:#2f8fff;box-shadow:0 3px 0 #1b4f99}
.ch .t{font-family:var(--display);font-size:1.3em;line-height:1.2}
.ch .fx{font-family:var(--pixel);font-size:10px;color:var(--dim);line-height:1.8}
.ch.picked{border-color:var(--amber);background:#2a1a55}
.ch.dimmed{opacity:.45}
.result{border-left:6px solid var(--amber);background:rgba(255,200,61,.08);padding:12px 16px;animation:pop .35s steps(4)}
.result.bad{border-color:var(--bad);background:rgba(255,97,80,.08)}
.result.good{border-color:var(--good);background:rgba(125,255,171,.07)}
.result b{font-family:var(--pixel);font-size:11px;display:block;margin-bottom:6px;font-weight:400}
.result.bad b{color:var(--bad)}.result.good b{color:var(--good)}
.result p{margin:0}
@keyframes pop{from{transform:scale(.96);opacity:0}}

/* BOSS */
.boss .q{font-family:var(--display);font-size:clamp(24px,2.2vw,38px);line-height:1.3;margin:0;text-wrap:balance}
.votes{display:flex;flex-direction:column;gap:10px}
.vote{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:#1a1040;border:3px solid var(--line);padding:10px 12px;text-align:left}
.vote:hover{border-color:var(--ink)}
.vote .n{font-family:var(--pixel);font-size:14px;color:var(--void);background:var(--cyan);width:32px;height:32px;display:grid;place-items:center}
.vote .lb{display:flex;flex-direction:column;gap:6px;min-width:0}
.vote .lb span{font-family:var(--display);font-size:1.2em;line-height:1.2}
.vote .lb small{color:var(--dim);font-size:.8em}
.bar{height:12px;background:#2b1f57;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--amber) 0 10px,transparent 10px 12px);transition:width .3s steps(6)}
.vote .c{font-family:var(--pixel);font-size:16px;color:var(--amber);min-width:3ch;text-align:right}
.tiny{font-size:.8em;color:var(--dim);margin:0}
.reset{background:none;border:2px solid var(--line);color:var(--dim);font-family:var(--pixel);font-size:10px;padding:8px 10px;align-self:flex-start}

/* ENDING */
.ending{align-items:center;text-align:center}
.rank{font-family:var(--pixel);font-size:clamp(18px,2.4vw,38px);line-height:1.4;margin:0;text-wrap:balance}
.rank.true{color:var(--good)}.rank.normal{color:var(--amber)}.rank.bad{color:var(--bad)}
.ending .msg{font-family:var(--display);font-size:clamp(20px,1.7vw,30px);max-width:34ch;margin:0;text-wrap:balance}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;width:100%;max-width:980px}
.tally div{border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.85em}
.tally b{font-family:var(--pixel);font-size:10px;color:var(--dim);font-weight:400}
.tally .A{color:var(--pink)}.tally .B{color:var(--cyan)}.tally .none{color:var(--dim)}
.cont{font-family:var(--pixel);font-size:clamp(14px,1.4vw,24px);color:var(--amber)}
.cont span{color:var(--pink)}
.credits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;width:100%;max-width:980px}
.credits label{display:flex;flex-direction:column;gap:6px;font-family:var(--pixel);font-size:10px;color:var(--pink);text-align:left}
.credits input{background:#1a1040;border:2px solid var(--line);color:var(--ink);font-family:var(--display);font-size:1.15em;padding:6px 10px;width:100%}
.src{font-size:.75em;color:var(--dim);max-width:980px;text-align:left;margin:0}
.again{font-family:var(--pixel);font-size:12px;background:none;border:3px solid var(--amber);color:var(--amber);padding:12px 18px}

/* VS */
.vsq{font-family:var(--display);font-size:clamp(22px,2vw,36px);color:var(--cyan);text-align:center;margin:0;text-wrap:balance}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;max-width:1400px;width:100%;margin-inline:auto;align-items:start}
.fighter{display:flex;flex-direction:column;gap:12px;min-width:0}
.fighter.r .fhead{text-align:right}
.fhead{display:flex;flex-direction:column;gap:8px}
.ptag{font-family:var(--pixel);font-size:11px;color:var(--pink);letter-spacing:.08em}
.fighter.r .ptag{color:#6fb4ff}
.hp{height:20px;border:3px solid var(--ink);background:#3a0d22;position:relative}
.hp i{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(90deg,var(--amber) 0 12px,#ff9d2e 12px 14px);transition:width .4s steps(8)}
.fighter.r .hp i{left:auto;right:0}
.fname{font-family:var(--display);font-weight:400;font-size:clamp(28px,2.6vw,46px);color:var(--amber);line-height:1.1;margin:0}
.fighter .sprite-wrap.flip{transform:scaleX(-1)}
.claim{font-family:var(--display);font-size:clamp(20px,1.6vw,28px);line-height:1.3;background:var(--panel);border:3px solid var(--ink);padding:12px 14px;box-shadow:6px 6px 0 #0b0620;margin:0}
.args{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.92em}
.args li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.args li::before{content:"►";font-family:var(--pixel);font-size:10px;color:var(--amber)}
.fvote{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1a1040;border:3px solid var(--line);padding:10px 14px;text-align:left}
.fvote:hover{border-color:var(--ink)}
.fvote span{font-family:var(--pixel);font-size:11px;color:var(--dim)}
.fvote b{font-family:var(--pixel);font-weight:400;font-size:22px;color:var(--amber)}
.fighter.lead .fvote{border-color:var(--amber)}
.vsmid{font-family:var(--pixel);font-size:clamp(30px,4vw,64px);color:var(--pink);text-shadow:4px 4px 0 #3b1d7a;align-self:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.vsmid small{font-size:11px;color:var(--dim);text-shadow:none}
.think{border:2px dashed var(--line);padding:12px 14px;font-size:.88em;color:var(--dim)}
.think b{font-family:var(--pixel);font-size:10px;color:var(--good);display:block;margin-bottom:8px;font-weight:400;letter-spacing:.08em}
@media (max-width:820px){.vs{grid-template-columns:minmax(0,1fr)}.vsmid{flex-direction:row}.fighter.r .fhead{text-align:left}}

/* PAD */
.pad{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:3px solid var(--line);padding-top:10px}
.pad .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pb{font-family:var(--pixel);font-size:11px;background:#251856;border:0;padding:12px 14px;box-shadow:0 4px 0 #0c0624;color:var(--ink)}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #0c0624}
.pb:disabled{opacity:.3;cursor:default}
.pb.a{background:var(--pink)}.pb.b{background:#2f8fff}
.pb.round{border-radius:50%;width:48px;height:48px;padding:0}
.keys{font-family:var(--pixel);font-size:9px;color:var(--dim);line-height:1.9}
.keys kbd{font-family:inherit;border:1px solid var(--line);padding:1px 5px;color:var(--ink)}

/* SPLASH + CRT */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:20;pointer-events:none;opacity:0;text-align:center;padding:20px}
#splash.go{animation:splash 1.15s steps(10) forwards}
#splash .s1{font-family:var(--pixel);font-size:clamp(28px,5vw,80px);color:var(--amber);text-shadow:5px 5px 0 var(--pink)}
#splash .s2{font-family:var(--display);font-size:clamp(26px,3vw,52px);color:var(--cyan);margin-top:14px}
@keyframes splash{0%{opacity:1;clip-path:inset(0 100% 0 0)}25%{opacity:1;clip-path:inset(0 0 0 0)}80%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
.crt{position:fixed;inset:0;pointer-events:none;z-index:30;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.85}}

@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .choices{grid-template-columns:1fr}
  .keys{display:none}
  body{overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #splash{display:none}
}
</style>

<div id="app">
  <header class="hud" aria-label="게임 상태">
    <div class="blk"><span class="lbl">SCORE<small>매출</small></span><span class="val" id="score">0000000</span></div>
    <div class="blk"><span class="lbl">STAGE</span><span class="dots" id="dots"></span></div>
    <div class="blk"><span class="lbl">TRUST<small>플레이어 신뢰</small></span><span class="trust" id="trust"></span></div>
    <div class="blk"><span class="lbl">HI-SCORE</span><span class="val" id="hi">0000000</span></div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="pad">
    <div class="grp">
      <button class="pb" id="prev" aria-label="이전 화면">◀ PREV</button>
      <button class="pb round a" id="btnA" aria-label="A 선택">A</button>
      <button class="pb round b" id="btnB" aria-label="B 선택">B</button>
      <button class="pb" id="next" aria-label="다음 화면">NEXT ▶</button>
    </div>
    <div class="keys"><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>A</kbd><kbd>B</kbd> 선택 · <kbd>1</kbd>–<kbd>4</kbd> 투표(VS는 1·2) · <kbd>F</kbd> 전체화면 · <kbd>M</kbd> 소리</div>
    <div class="grp">
      <button class="pb" id="snd" aria-pressed="false">SOUND OFF</button>
      <button class="pb" id="full">FULL</button>
    </div>
  </footer>
  <div id="splash"><div><div class="s1" id="s1"></div><div class="s2" id="s2"></div></div></div>
  <div class="crt"></div>
</div>

<script>
/* ---------- 픽셀 스프라이트 ---------- */
const GHOST=[[
"....aaaa....","..aaaaaaaa..",".aaaaaaaaaa.",".aawwaawwaa.",".aawkaawkaa.",".aaaaaaaaaa.",".aaabbbbaaa.",".aaaabbaaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.",".a.aa..aa.a."],[
"....aaaa....","..aaaaaaaa..",".aaaaaaaaaa.",".aawwaawwaa.",".aakwaakwaa.",".aaaaaaaaaa.",".aabbbbbbaa.",".aaabbbbaaa.",".aaaaaaaaaa.",".aaaaaaaaaa.","..a.aaaa.a.."]];
const CRAB=[[
"..a......a..","...a....a...","..aaaaaaaa..",".aakaaaakaa.","aaaaaaaaaaaa","a.aabbbbaa.a","a.a......a.a","...aa..aa..."],[
"..a......a..","a..a....a..a","a.aaaaaaaa.a",".aakaaaakaa.","aaaaaaaaaaaa","..aabbbbaa..",".a.a....a.a.","aa........aa"]];
const DEV=[[
"...hhhhhh...","..hhhhhhhh..","..hssssssh..","..skwsskws..","..ssssssss..","..sssmmsss..","...ssssss...",".cccccccccc.","cccccccccccc","cc.cccccc.cc","...cc..cc..."],[
"...hhhhhh...","..hhhhhhhh..","..hssssssh..","..skwsskws..","..ssssssss..","..ssmmmmss..","...ssssss...","c.cccccccc.c","c.cccccccc.c","..cccccccc..","..cc....cc.."]];
const CAT=[[
"..aa....aa..",".aaaa..aaaa.","aaaaaaaaaaaa","aawwaaaawwaa","aawkaaaawkaa","aaaaaaaaaaaa",".aaabbbbaaa.","..aaaaaaaa..","...aaaaaa...","....aaaa....",".....aa....."],[
"..aa....aa..",".aaaa..aaaa.","aaaaaaaaaaaa","aawwaaaawwaa","aakwaaaakwaa","aaaaaaaaaaaa",".aabaaaabaa.","..aabbbbaa..","...aaaaaa...","....aaaa....",".....aa....."]];
const ROBOT=[[
".....b......","....aaaa....","..aaaaaaaa..","..awwaawwa..","..akwaakwa..","..aaaaaaaa..","..aabbbbaa..","....aaaa....",".aaaaaaaaaa.",".a.aaaaaa.a.",".a.aaaaaa.a.","...a....a..."],[
".....b......","....aaaa....","..aaaaaaaa..","..abbaabba..","..abbaabba..","..aaaaaaaa..","..aaaaaaaa..","....aaaa....",".aaaaaaaaaa.","aa.aaaaaa.aa","...aaaaaa...","..a......a.."]];
const SPR = {
  thief:{pal:{a:'#c9b8ff',b:'#ff4f9a',w:'#ffffff',k:'#150c2f'},f:GHOST},
  extort:{pal:{a:'#ffc83d',b:'#ff4f9a',k:'#150c2f'},f:CRAB},
  devA:{pal:{h:'#3a2a1a',s:'#ffd2a8',w:'#ffffff',k:'#150c2f',m:'#c4466a',c:'#ff4f9a'},f:DEV},
  devB:{pal:{h:'#1c1c3a',s:'#f0c08e',w:'#ffffff',k:'#150c2f',m:'#c4466a',c:'#2f8fff'},f:DEV},
  gamer:{pal:{a:'#ff7fb8',b:'#150c2f',w:'#ffffff',k:'#150c2f'},f:CAT},

  const row=['extort','thief','devA','gamer','platform'];let t=0;

    </div>
    <div class="play">
      <div class="scenario"><p class="q">AI로 베낀 게임 때문에 피해가 생겼다.<br>가장 큰 책임은 누구에게 있을까?</p></div>
      <p class="tiny">청중에게 손을 들게 하고, 숫자 키 1–4 또는 버튼을 눌러 표를 더하세요.</p>
      <div class="votes">${VOTES.map((v,k)=>`<button class="vote" data-v="${k}">
        <span class="n">${k+1}</span>
        <span class="lb"><span>${v.t}</span><small>${v.d}</small><span class="bar"><i style="width:${S.votes[k]/max*100}%"></i></span></span>
        <span class="c">${S.votes[k]}</span></button>`).join('')}</div>
      <button class="reset" id="vreset">투표 초기화</button>
    </div></div>`;
  sec.querySelector('.sprite-wrap').appendChild(spriteCanvas('hydra'));
  sec.querySelectorAll('.vote').forEach(b=>b.onclick=()=>vote(+b.dataset.v));
  sec.querySelector('#vreset').onclick=()=>{S.votes=[0,0,0,0];render();};
  main.appendChild(sec);
}
function vote(k){
  const id=cur();
  if(id[0]==='v'){if(k<2)vsVote(+id.slice(1),k);return;}
  if(id!=='boss')return;S.votes[k]++;beep(660+k*110,.07);
  const max=Math.max(...S.votes,1);
  main.querySelectorAll('.vote').forEach((b,j)=>{b.querySelector('.c').textContent=S.votes[j];b.querySelector('.bar i').style.width=(S.votes[j]/max*100)+'%';});
  hud();
}
function renderEnd(){
  const {t}=totals();const n=Object.keys(S.ch).length;
  let cls,rank,msg;
  if(n===0){cls='normal';rank='NO PLAY';msg='아직 아무 선택도 하지 않았어요. 스테이지로 돌아가 A나 B를 골라 보세요.';}
  else if(t>=75){cls='true';rank='TRUE ENDING<br>아이디어를 지킨 개발사';msg='느리게 갔지만 남의 아이디어를 존중했고, 협박에도 굴하지 않았다. AI가 복제를 쉽게 만들수록, 지키는 선택이 더 큰 신뢰가 된다.';}
  else if(t>=40){cls='normal';rank='NORMAL ENDING<br>아슬아슬한 줄타기';msg='이익과 신뢰 사이에서 흔들렸다. AI로 베끼기가 쉬운 시대에는 한 번의 선택이 회사의 이름을 바꾼다.';}
  else{cls='bad';rank='BAD ENDING<br>빨리 벌었지만';msg='점수판은 화려하다. 그런데 이 게임이 누구의 아이디어였는지 모두가 알고 있다. HI-SCORE가 꼭 좋은 엔딩은 아니다.';}
  const top=S.votes.reduce((m,v,k)=>v>S.votes[m]?k:m,0);
  const vsRes=k=>{const [a,b]=S.vs[k];if(!a&&!b)return['none','— 투표 없음'];if(a===b)return['B',`무승부 (${a}:${b})`];return a>b?['A',`${VS[k].L.name} 승 (${a}:${b})`]:['B',`${VS[k].R.name} 승 (${a}:${b})`];};
  const sec=document.createElement('section');sec.className='screen ending';
  sec.innerHTML=`<p class="rank ${cls}">${rank}</p>
    <p class="msg">${msg}</p>
    <div class="tally">
      ${STAGES.map((st,k)=>`<div><b>STAGE ${k+1}</b><span>${st.name}</span><span class="${S.ch[k]||'none'}">${S.ch[k]?S.ch[k]+' · '+st[S.ch[k]].t:'— 미선택'}</span></div>`).join('')}
      ${VS.map((v,k)=>{const [c,txt]=vsRes(k);return `<div><b>ROUND ${k+1}</b><span>${v.title}</span><span class="${c}">${txt}</span></div>`;}).join('')}
      <div><b>BOSS VOTE</b><span>최다 득표</span><span class="B">${S.votes.some(v=>v)?VOTES[top].t+' ('+S.votes[top]+'표)':'— 투표 없음'}</span></div></div>
    <p class="cont">CONTINUE? <span id="cd">9</span></p>
    <div class="credits">${[1,2,3,4].map(k=>`<label for="p${k}">PLAYER ${k}<input id="p${k}" placeholder="이름" maxlength="12" autocomplete="off"></label>`).join('')}</div>
    <button class="again" id="again">↺ NEW GAME (R)</button>`;
  main.appendChild(sec);
  [1,2,3,4].forEach(k=>{const el=document.getElementById('p'+k);el.value=store('arcade-p'+k)||'';el.addEventListener('input',()=>store('arcade-p'+k,el.value));});
  document.getElementById('again').onclick=newGame;
  let c=9;const cd=document.getElementById('cd');
  cdTimer=setInterval(()=>{c--;if(c<0){clearInterval(cdTimer);cd.parentElement.innerHTML='Q&amp;A <span>질문 받습니다</span>';jingle([523,392,523,659,784]);return;}cd.textContent=c;beep(330,.05);},1000);
  if(n)setTimeout(()=>jingle(cls==='bad'?[392,370,349,330]:[523,659,784,1047,1319]),200);
}
function newGame(){S.ch={};S.vs=VS.map(()=>[0,0]);S.votes=[0,0,0,0];go(0);}

/* ---------- 이동 ---------- */
const splash=document.getElementById('splash');
function go(n){
  n=Math.max(0,Math.min(SCREENS.length-1,n));if(n===S.i&&main.childElementCount)return;
  const fwd=n>S.i;S.i=n;const id=SCREENS[n];
  if(fwd&&id!=='title'){
    let a,b;
    if(id==='boss'){a='WARNING!';b='책임의 히드라 출현';}
    else if(id==='end'){a='GAME OVER';b='결과를 집계합니다';}
    else if(id[0]==='v'){const k=+id.slice(1);a='ROUND '+(k+1);b=VS[k].L.name+' VS '+VS[k].R.name+' · FIGHT!';}
    else{const k=+id.slice(1);a='STAGE '+(k+1);b=STAGES[k].name;}
    document.getElementById('s1').textContent=a;document.getElementById('s2').textContent=b;
    splash.classList.remove('go');void splash.offsetWidth;splash.classList.add('go');
    beep(id==='boss'?220:440,.15);setTimeout(render,330);
  }else render();
}
document.getElementById('prev').onclick=()=>{beep(300);go(S.i-1);};
document.getElementById('next').onclick=()=>{beep(500);go(S.i+1);};
document.getElementById('btnA').onclick=()=>choose('A');
document.getElementById('btnB').onclick=()=>choose('B');
const sndBtn=document.getElementById('snd');
function toggleSound(){S.sound=!S.sound;sndBtn.textContent=S.sound?'SOUND ON':'SOUND OFF';sndBtn.setAttribute('aria-pressed',S.sound);beep(880,.1);}
sndBtn.onclick=toggleSound;
function full(){const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
document.getElementById('full').onclick=full;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='pagedown'||(k==='enter'&&S.i===0)){e.preventDefault();if(S.i===0)jingle([523,659,784,1047]);else beep(500);go(S.i+1);}
  else if(k==='arrowleft'||k==='pageup'){e.preventDefault();beep(300);go(S.i-1);}
  else if(k==='a'||k==='b')choose(k.toUpperCase());
  else if(['1','2','3','4'].includes(k))vote(+k-1);
  else if(k==='f')full();
  else if(k==='m')toggleSound();
  else if(k==='home')go(0);
  else if(k==='r'&&cur()==='end')newGame();
});
render();
</script>

</body></html>
